services:
  suricata:
    image: jasonish/suricata:7.0.17
    container_name: suricata
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SURICATA_OPTIONS: "-i ${SURICATA_INTERFACE:-virbr0}"
    volumes:
      - ./config:/etc/suricata
      - ./logs:/var/log/suricata
      - ./lib:/var/lib/suricata
      - ../../assets/pcaps:/pcaps:ro
