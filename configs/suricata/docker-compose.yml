services:
  suricata:
    image: jasonish/suricata:7.0.17
    container_name: suricata
    restart: unless-stopped
    # network_mode host é obrigatório para sniffar a interface do host (R3).
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # virbr0 é a ponte do libvirt, por onde passa o tráfego entre a máquina
      # SOC e a VM vítima, incluindo os ataques originados no host (D7).
      SURICATA_OPTIONS: "-i ${SURICATA_INTERFACE:-virbr0}"
    volumes:
      - ./config:/etc/suricata
      - ./logs:/var/log/suricata
      - ./lib:/var/lib/suricata
      # pcaps públicos para replay em modo offline (T13).
      - ../../assets/pcaps:/pcaps:ro
